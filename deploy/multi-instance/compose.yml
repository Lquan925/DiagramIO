name: diagramio-multi

x-backend: &backend
  image: diagramio-multi:${APP_IMAGE_TAG:-local}
  restart: unless-stopped
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-diagram_multi}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-diagram}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX:-5}
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}
    JWT_SECRET: ${JWT_SECRET:?Set one shared JWT_SECRET of at least 32 characters}
    JAVA_TOOL_OPTIONS: -Xmx${JAVA_HEAP_MB:-512}m
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    SERVER_COMPRESSION_ENABLED: ${SERVER_COMPRESSION_ENABLED:-true}
    SERVER_COMPRESSION_MIN_RESPONSE_SIZE: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:-2KB}
    CACHE_MODE: disabled
    SHARING_DEFAULT_LINK_TTL: ${SHARING_DEFAULT_LINK_TTL:-7d}
    MONITORING_ALLOW_LOCAL: 'false'
    MONITORING_SECRET_TOKEN: ${MONITORING_SECRET_TOKEN:?Set a separate monitoring token}
    MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: /actuator
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    SAMPLE_ACCOUNT_ACTION: ${SAMPLE_ACCOUNT_ACTION:-disable}
    RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
    RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
  expose: ['8080']
  networks: [private]
  cpus: ${BACKEND_CPUS:-1.0}
  mem_limit: ${BACKEND_MEMORY:-1024m}
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 90s
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diagram_multi}
      POSTGRES_USER: ${POSTGRES_USER:-diagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ['postgres', '-c', 'max_connections=${POSTGRES_MAX_CONNECTIONS:-50}']
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY:-1024m}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  backend1:
    <<: *backend
    build:
      context: ../..
      dockerfile: Dockerfile
  backend2:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      backend1:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['${LB_BIND_IP:-127.0.0.1}:${LB_PORT:-8088}:80']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [edge, private]
    cpus: ${NGINX_CPUS:-0.25}
    mem_limit: ${NGINX_MEMORY:-128m}
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/api/v1/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
networks:
  edge: {}
  private:
    internal: true
