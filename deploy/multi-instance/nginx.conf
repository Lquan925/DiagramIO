worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    log_format upstream '$remote_addr "$request_method $uri" status=$status upstream=$upstream_addr upstream_status=$upstream_status time=$request_time';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;
    gzip off; # Backend Tomcat owns compression; pass Content-Encoding and Vary unchanged.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream diagram_backends {
        zone diagram_backends 64k;
        server backend1:8080 resolve max_fails=1 fail_timeout=5s;
        server backend2:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
    }
    server {
        listen 80;
        server_name _;
        client_max_body_size 8m; # data limit is 2MiB; request contains envelope/escaping.
        client_body_timeout 60s;
        location ~* ^/actuator { return 404; }
        location / {
            proxy_pass http://diagram_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Forwarded-Server "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            # No non_idempotent: never opt into replaying a POST already sent upstream.
        }
    }
}
