spring:
  application:
    name: diagramio
  datasource:
    # Mặc định khớp docker-compose.yml; ghi đè bằng biến môi trường SPRING_DATASOURCE_*
    url: jdbc:postgresql://localhost:5432/diagram_app
    username: root
    password: secretpassword
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema do Flyway quản lý, Hibernate chỉ kiểm tra
  flyway:
    enabled: true

server:
  # Sau proxy/load balancer: dùng X-Forwarded-Host/Proto để ghép đúng địa chỉ bên ngoài (vd. shareUrl)
  forward-headers-strategy: framework

springdoc:
  # Sắp xếp khóa cố định để docs/openapi.yaml xuất lại không bị đổi thứ tự
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-it-32chars}
  access-token-minutes: 15
  refresh-token-days: 7

rate-limit:
  auth:
    max-requests: 10
    window-seconds: 60

cleanup:
  refresh-tokens:
    cron: "0 0 3 * * *"
    retention-days: 7
    batch-size: 1000
    max-batches: 10

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Authorization
    - Retry-After
    - X-Share-Token
  allow-credentials: true
  max-age-seconds: 3600

sample-account:
  # Hành động với tài khoản mẫu (keep / disable / delete). Mặc định ở dev là keep.
  action: ${SAMPLE_ACCOUNT_ACTION:keep}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      hikaricp: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s

monitoring:
  # Token bảo mật truy cập endpoint giám sát /actuator/**
  secret-token: ${MONITORING_SECRET_TOKEN:monitoring-secret-token-32chars-ok}
  # Cho phép IP local / loopback truy cập mà không cần token
  allow-local: true




