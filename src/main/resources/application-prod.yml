# ===================================================================
# Cấu hình môi trường Production cho DiagramIO
# Kích hoạt bằng: --spring.profiles.active=prod hoặc SPRING_PROFILES_ACTIVE=prod
# ===================================================================

spring:
  jpa:
    show-sql: false

jwt:
  # BẮT BUỘC cung cấp JWT secret riêng an toàn (>= 32 ký tự) qua biến môi trường JWT_SECRET.
  # Ứng dụng sẽ từ chối khởi động nếu giá trị này để trống hoặc trùng với secret mặc định của dev.
  secret: ${JWT_SECRET:}

sample-account:
  # Tự động vô hiệu hóa tài khoản mẫu uet@gmail.com trên production để tránh nguy cơ bảo mật.
  action: ${SAMPLE_ACCOUNT_ACTION:disable}

cors:
  # Danh sách domain frontend production được phép gọi API (phân tách bởi dấu phẩy qua biến môi trường CORS_ALLOWED_ORIGINS).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://diagramio.com,https://app.diagramio.com}
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - X-Share-Token
    - Accept
    - Origin
  exposed-headers:
    - Authorization
    - Retry-After
    - X-Share-Token
  allow-credentials: true
  max-age-seconds: 3600
